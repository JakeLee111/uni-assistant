# Keeps the Blackboard session alive. Triggered hourly by cron-job.org (workflow_dispatch),
# with GitHub's own 3-hourly schedule as a backup (GitHub often skips scheduled runs).
# The first run after 07:00 Bangkok each day also scrapes Blackboard + Outlook for the 08:00 report.
# Session cookies and scraped data live encrypted on the `session` branch.
name: session
on:
  schedule:
    - cron: '17 */3 * * *'
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      scrape:
        description: 'Also scrape now'
        type: boolean
        default: false
concurrency: session
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04  # pinned: Playwright 1.56 can't install Chromium on ubuntu-latest (26.04)
    timeout-minutes: 20
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: session
          path: session
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistant/package-lock.json
      - run: npm ci
        working-directory: assistant
      - name: Decrypt session
        run: |
          mkdir -p assistant/auth
          openssl enc -d -aes-256-cbc -pbkdf2 -in session/state.enc -out assistant/auth/state.json -pass env:STATE_KEY
      - name: Keep alive
        id: alive
        working-directory: assistant
        env:
          BB_USER: ${{ secrets.BB_USER }}
          BB_PASS: ${{ secrets.BB_PASS }}
        run: node keepalive.js && echo "status=ok" >> "$GITHUB_OUTPUT" || echo "status=signed-out" >> "$GITHUB_OUTPUT"
      - name: Alert if signed out
        if: steps.alive.outputs.status == 'signed-out'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Only alert on the first failed check, not every hour.
          grep -q '"blackboard":"ok"' session/status.json || exit 0
          curl -sf "https://api.telegram.org/bot$TOKEN/sendMessage" --data-urlencode chat_id="$CHAT" \
            --data-urlencode text="⚠️ Blackboard signed you out and automatic sign-in failed. On your Mac run: cd ~/Desktop/\"Personal Assistant\"/university/assistant && npm run login && npm run push-session" > /dev/null
      - name: Scrape today?
        id: due
        run: |
          today=$(TZ=Asia/Bangkok date +%F); hour=$(TZ=Asia/Bangkok date +%H)
          last=$(grep -o '"lastScrape":"[^"]*"' session/status.json 2>/dev/null | cut -d'"' -f4)
          if [ "${{ inputs.scrape }}" = "true" ] || { [ "$hour" -ge 7 ] && [ "$last" != "$today" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "last=$today" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "last=$last" >> "$GITHUB_OUTPUT"
          fi
      - name: Scrape
        if: steps.due.outputs.run == 'true'
        continue-on-error: true
        working-directory: assistant
        run: |
          npx playwright install --with-deps chromium
          node scrape.js
          openssl enc -aes-256-cbc -pbkdf2 -salt -in ../data/latest.json -out ../session/latest.json.enc -pass env:STATE_KEY
      - name: Save session
        if: always()
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt -in assistant/auth/state.json -out session/state.enc -pass env:STATE_KEY
          echo "{\"checkedAt\":\"$(date -u +%FT%TZ)\",\"blackboard\":\"${{ steps.alive.outputs.status }}\",\"lastScrape\":\"${{ steps.due.outputs.last }}\"}" > session/status.json
          cd session
          git config user.name "JakeLee111"
          git config user.email "88223573+JakeLee111@users.noreply.github.com"
          # Keep a single commit on this branch so hourly runs don't grow the repo.
          git checkout -q --orphan fresh
          git add -A
          git commit -q -m "session $(date -u +%FT%TZ)"
          git push -q -f origin fresh:session
